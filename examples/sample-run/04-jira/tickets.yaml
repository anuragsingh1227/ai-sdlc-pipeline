project: OPS
epic:
  issueType: Epic
  summary: Order explain for support agents
  description: Internal, single-shot explanation grounded in one order's events. See the feature spec Behavior section.
  labels:
    - ai-sdlc
    - order-explain
stories:
  - issueType: Story
    summary: Return a cited explanation for an order
    description: Spec behavior "Request an explanation". Citations must be a subset of the order's events.
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      And order 1001 has event e-1
      When the agent requests an explanation for order 1001
      Then the response is HTTP 200
      And every citation event id belongs to order 1001
    parent: epic
    labels:
      - order-explain
    components:
      - order-api
  - issueType: Story
    summary: Return fixed copy when the order has no events
    description: Spec behavior "No events". Do not call the model.
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      And order 1002 has no events
      When the agent requests an explanation for order 1002
      Then the response is HTTP 200
      And the text is "No order events are available to explain."
      And the citation list is empty
      And the model gateway is not called
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Reject callers without ORDER_READ
    description: Spec API error 403.
    acceptanceCriteria: |
      Given an agent without role ORDER_READ
      When the agent requests an explanation for order 1001
      Then the response is HTTP 403
      And the model gateway is not called
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Reject unknown orders
    description: Spec API error 404.
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      And order 9999 does not exist
      When the agent requests an explanation for order 9999
      Then the response is HTTP 404
      And the model gateway is not called
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Reject questions longer than 500 characters
    description: Spec API error 400.
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      When the agent submits a question longer than 500 characters
      Then the response is HTTP 400
      And the model gateway is not called
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Map gateway timeout to 504 without a successful audit
    description: Spec failure on "Request an explanation".
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      And order 1001 has events
      And the model gateway times out
      When the agent requests an explanation for order 1001
      Then the response is HTTP 504
      And no successful audit row is written
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Leave the order unchanged after a successful explanation
    description: Spec behavior "No mutation".
    acceptanceCriteria: |
      Given a support agent with role ORDER_READ
      And order 1001 has events
      When an explanation request for order 1001 succeeds
      Then order status, events, refunds, and shipments are unchanged
    parent: epic
    components:
      - order-api
  - issueType: Story
    summary: Show explain results on the order detail page
    description: Spec UI section. No navigation, no email, no status edit.
    acceptanceCriteria: |
      Given a support agent is viewing the order detail page for order 1001
      When the agent activates Explain this order
      Then the panel stays on the order page
      And while the request is in flight the button is disabled and the status text is "Explaining order"
      And a successful response shows the explanation text and each citation event id
    parent: epic
    components:
      - order-console
